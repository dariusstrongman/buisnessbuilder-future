name: Offline Business Builder CI

on:
  push:
    branches:
      - main
      - "integration/**"
      - "worker*/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test*.py' -v
