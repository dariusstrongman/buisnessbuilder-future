name: Offline Business Builder CI

on:
  push:
    branches:
      - main
      - "integration/**"
      - "worker*/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Run complete offline test suite
        run: python -m pytest -q
