[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "businessbuilder-company-brain"
version = "0.1.0"
description = "Offline, provider-neutral Company Brain domain and persistence layer"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"businessbuilder.company_brain" = ["migrations/*.sql"]
