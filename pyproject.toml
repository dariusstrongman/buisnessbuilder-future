[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "businessbuilder-runtime"
version = "0.1.0"
description = "Provider-neutral offline orchestration runtime for Business Builder"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/runtime"]
pythonpath = ["src"]
